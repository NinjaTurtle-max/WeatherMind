# 대회 마감 알림 — 규정이 못박은 3개 시점에 이슈를 자동 생성한다.
#
# 왜 워크플로인가: 이 알림은 8/17~8/21에 울려야 하는데, 대화 세션 기반 알림은
# 세션이 끝나면 사라진다. 저장소에 있는 것만 그때까지 살아남는다.
#
# cron은 UTC다 — KST = UTC+9이므로 "0 0 17 8 *"는 8/17 09:00 KST에 뜬다.
# GitHub 스케줄러는 수십 분 지연될 수 있으나 하루 단위 알림이라 무해하다.
#
# 근거: docs/team/HACKATHON_RULES.md §1.1 · §5-E
name: 마감 알림

on:
  schedule:
    - cron: '0 0 17 8 *'   # 8/17 09:00 KST — 기능 동결일 (ROADMAP §5.5)
    - cron: '0 0 20 8 *'   # 8/20 09:00 KST — 제출 산출물 ②③④ 마감
    - cron: '0 0 21 8 *'   # 8/21 09:00 KST — 전면 동결 9시간 전 최종 경고
  workflow_dispatch:       # 수동 실행으로 동작 확인용

permissions:
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // KST 기준 월/일 (러너는 UTC라 9시간 더한다)
            const kst = new Date(Date.now() + 9 * 60 * 60 * 1000);
            const key = `${kst.getUTCMonth() + 1}/${kst.getUTCDate()}`;

            const PLAN = {
              '8/17': {
                title: '⏸ 8/17 기능 동결일 — 계약값 변경은 오늘까지',
                body: [
                  '**오늘부터 코드 변경을 멈추고 env 파라미터 조정만 한다.**',
                  '',
                  '계약 수치(`SESSION_RECIPE`·`CLOUD_*`·`REVIEW_INTERVALS_DAYS`·',
                  '`SLIDER_TOLERANCE`·`LEAGUE_DIVISION_SIZE`)를 **바꾸려면 오늘 안에** 바꾼다.',
                  '계약 테스트가 "env 기본값 = 계약값"을 감시하므로 이후 변경은 코드 변경이 된다.',
                  '',
                  '- [ ] 계약값 최종 확정 (ROADMAP §5.5 조정 대상 표)',
                  '- [ ] 8/18 b 재보정 준비 — DB 파라미터 갱신이지 소스 변경이 아님을 확인',
                  '',
                  '근거: `docs/ROADMAP.md` §5.5',
                ].join('\n'),
              },
              '8/20': {
                title: '📦 8/20 제출 산출물 마감 — 소스·세션·README',
                body: [
                  '**내일 18:00이 전면 동결이다. 제출물은 오늘 끝낸다.**',
                  '',
                  '- [ ] **② 소스 zip** — `node_modules`·`dist`·`.venv`·`__pycache__`·`.env` 제외 /',
                  '      `.env.example`·마이그레이션·시드·스크립트 **포함**. 압축 해제 후 무키 기동 실증',
                  '- [ ] **③ 프롬프트 세션** — `.jsonl` → `.md` 변환 + **비밀값 스캔 재실행**',
                  '      ⚠️ G0~G2에서 실키를 넣었다면 8/06 스캔 결과는 무효다. 반드시 다시 돌린다',
                  '- [ ] **④ README** — 외부 리소스 인벤토리(라이브러리·버전·라이선스 /',
                  '      이미지·폰트 출처 / 데이터 공공누리 유형) · 배포 재현 절 · 모델·데이터셋 위치',
                  '- [ ] **zip 전수 비밀값 스캔** — 키 노출은 실격이다',
                  '- [ ] 배포 URL을 **팀 자체 발급 KMA 키**로 전환 (대회 제공 키는 8/22 만료)',
                  '',
                  '근거: `docs/team/HACKATHON_RULES.md` §1 · §5-B~D',
                ].join('\n'),
              },
              '8/21': {
                title: '🔴 오늘 18:00 전면 동결 — 9시간 남음',
                body: [
                  '**18:00 이후 소스코드를 변경할 수 없다.**',
                  '검증 기간 중 **핵심 로직 수정 또는 소스코드 누락이 확인되면 탈락**이다.',
                  '',
                  '- [ ] 제출물 4종 업로드 완료 확인 (구동 URL·소스 zip·세션 zip·README)',
                  '- [ ] **env 파라미터 조정도 여기서 끝** — 이후엔 "핵심 로직 수정"으로',
                  '      오해받을 수 있다',
                  '- [ ] 구동 URL 최종 점검: 크롬 1366×768 / 1920×1080 / 2560×1440,',
                  '      **로그인 없이 바로 조작되는지**',
                  '- [ ] URL은 **시상식(9월 셋째 주)까지 유지** — 서버 결제·갱신 상태 확인',
                  '',
                  '근거: `docs/team/HACKATHON_RULES.md` §1.1',
                ].join('\n'),
              },
            };

            const plan = PLAN[key];
            if (!plan) {
              core.info(`오늘(${key} KST)은 알림 대상이 아니다 — 수동 실행으로 보인다.`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: plan.title,
              body: plan.body,
            });
            core.info(`${key} 알림 이슈를 생성했다.`);
