name: Release

# WeatherMind CD — main 병합 시 4개 서비스 이미지를 GHCR에 빌드·발행한다.
# **빌드·push까지가 이 워크플로의 전부다** — 실서버 배포(ssh·kubectl 등)는
# 범위 밖(SPRINT_R11_01 §7.0: 프로덕션 인프라 부재, "실서버 배포"는 8/17 실체에서
# 명시 제외). 발행된 이미지는 docker-compose.prod.yml(DO-1 소유)이 참조한다.
#
# 이미지 명명: ghcr.io/<owner>/<repo>-<서비스> (예: ghcr.io/ninjaturtle-max/
# weathermind-backend). GHCR은 이미지 이름에 소문자만 허용하는데
# github.repository는 대문자를 포함하므로(NinjaTurtle-max/WeatherMind) 잡 안에서
# 소문자로 변환한다.
#
# celery 이미지 하나로 celery-worker·celery-beat 둘 다 커버한다 — compose에서
# 두 서비스는 같은 빌드 컨텍스트(./celery)에 command만 다르다.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# GHCR push에 필요한 최소 권한: 체크아웃 읽기 + 패키지 쓰기.
permissions:
  contents: read
  packages: write

# cancel-in-progress: false — CI와 달리 발행은 도중에 끊으면 안 된다.
# 매트릭스 4개 중 일부만 push된 채 취소되면 서비스별 :latest가 서로 다른
# 커밋을 가리키는 혼합 상태가 GHCR에 남고, 취소된 커밋의 :sha 태그도 결손된다.
# 연속 push는 취소 대신 직렬 대기시켜 각 커밋의 발행을 온전히 끝낸다.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── build-push: 서비스별 이미지 빌드 → GHCR 발행 (배포 없음) ────────────────
  build-push:
    name: build-push (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # 한 서비스 빌드 실패가 나머지 발행을 막지 않는다 — 서비스별 독립 발행.
      # (전체 성공 여부는 잡 상태로 그대로 드러난다.)
      fail-fast: false
      matrix:
        # 각 서비스 디렉토리에 Dockerfile 실존(backend·frontend·ai-worker·celery).
        service: [backend, frontend, ai-worker, celery]
    steps:
      - uses: actions/checkout@v4

      # GHCR 소문자 요구사항 처리: NinjaTurtle-max/WeatherMind →
      # ninjaturtle-max/weathermind. 하드코딩 대신 변환으로 포크에서도 동작.
      - name: 이미지 이름 계산 (소문자 변환)
        id: image
        run: |
          repo_lc="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${repo_lc}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      # buildx: GHA 캐시(type=gha) 사용을 위해 필요 — 재빌드 시간 단축.
      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 태그 전략: 커밋 sha(불변 — prod 오버레이가 고정 참조) + latest(이동 —
      # 최신 main 편의 참조) 둘 다 발행.
      - name: 빌드 & push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=release-${{ matrix.service }}
          cache-to: type=gha,scope=release-${{ matrix.service }},mode=max
