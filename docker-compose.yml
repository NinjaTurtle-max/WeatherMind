# =============================================================================
# WeatherMind dev 스택 (prod는 docker-compose.prod.yml 오버레이와 함께 쓴다)
#
# ── restart 정책 (CO-J-16) ───────────────────────────────────────────────────
# dev = `on-failure:5`. **횟수 상한이 있는 것이 요점이다** — 재기동으로 넘길 수 있는
# 일시 실패(의존이 아직 안 뜸)는 넘기고, 코드·설정이 틀려서 나는 반복 실패는 5회
# 뒤에 멈춰 로그가 남는다. dev에서 `always`를 쓰면 깨진 컨테이너가 영원히 재기동하며
# 로그를 밀어내 디버깅을 방해한다.
# prod는 오버레이가 전 서비스를 `unless-stopped`로 덮는다 — 이유는 그쪽 주석 참조
# (요약: on-failure는 호스트 재부팅 후 컨테이너를 되살리지 않는다).
#
# ── depends_on 표기 ──────────────────────────────────────────────────────────
# **전 서비스가 롱폼(맵) 표기다.** 리스트와 맵을 섞으면 오버레이 병합에서 한쪽이
# 통째로 무시될 수 있어 파일 단위로 통일한다. healthcheck가 있는 서비스는 backend
# 하나뿐이므로 `service_healthy`는 backend를 가리키는 간선에만 붙는다 —
# healthcheck 없는 서비스에 걸면 그 의존은 **영원히 만족되지 않는다**.
# =============================================================================
services:
  frontend:
    build: ./frontend
    restart: "on-failure:5"
    ports:
      - "80:80"
    env_file: .env
    depends_on:
      # backend가 **healthy**가 될 때까지 정적 SPA를 띄우지 않는다. 종전에는
      # service_started라 API가 죽은 채로 화면만 떠서 "빈 앱"이 배포될 수 있었다.
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    restart: "on-failure:5"
    ports:
      - "8000:8000"
    env_file: .env
    # ── BE-2 교차 계약 (R11-01 §7.1 ①·② — RLS 롤 분리, 계약 반영 완료) ──
    # .env의 DB 접속 키 2종을 이 컨테이너가 소비한다 (env_file: .env 경유 —
    # compose 키 추가 불필요, 두 키 모두 자동 전달):
    #   DATABASE_URL           = 앱 전용 비특권 롤(weathermind_app, NOBYPASSRLS)
    #                            — 런타임 엔진(backend/app/core/database.py)
    #   MIGRATION_DATABASE_URL = 소유자 롤(POSTGRES_USER) — alembic 전용
    #                            (backend/alembic/env.py가 env 직독, 미설정 시
    #                            DATABASE_URL 폴백 = 종전 동작. config.py 무접촉)
    # 롤 생성: database/init.sql(신규 볼륨)·backend/app/scripts/rls_app_role.sql
    # (기존 볼륨, 멱등) — 실DB 적용은 PM 게이트(§7.2). .env.example 반영은 DO-2 소유.
    volumes:
      # 문항 시드 적재(app.scripts.seed_content)용 — 스크립트의 컨테이너 내
      # 기본 경로가 /database/seed/content_items.json 이다 (RUNBOOK 참조)
      - ./database/seed:/database/seed:ro
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    # ⚠️ 이 healthcheck는 이제 **소비자가 있다** — frontend(dev)와 caddy(prod)가
    # service_healthy로 여기에 물려 있다. 그래서 주기를 촘촘하게 바꿨다:
    # 종전 interval 30s면 첫 판정이 30초 뒤라 의존 서비스가 그만큼 늦게 뜬다.
    # start_period 동안의 실패는 retries에 계상되지 않으므로(기동 중 = starting)
    # 기동이 느린 날에도 unhealthy로 오판하지 않는다.
    # /health는 DB SELECT 1 + Redis PING을 본다(마이그레이션 여부가 아니다) —
    # 즉 **DB에 닿기만 하면 healthy**이므로 초기화 전에도 정상적으로 초록이 된다.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  ai-worker:
    build: ./ai-worker
    restart: "on-failure:5"
    ports:
      - "8001:8001"
    env_file: .env
    # 이 마운트는 선택이 아니다 — 피드백 체인의 개념 문서(climate_concepts.json)와
    # 결정적 어휘 게이트(level_vocabulary.json)가 여기서 읽힌다. 경로 관례는
    # ai-worker/app/chains/seed_paths.py 단일 소유.
    volumes:
      - ./database/seed:/app/database/seed:ro
    depends_on:
      redis:
        condition: service_started

  celery-worker:
    build: ./celery
    restart: "on-failure:5"
    command: celery -A app.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      ai-worker:
        condition: service_started

  celery-beat:
    build: ./celery
    restart: "on-failure:5"
    command: celery -A app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file: .env
    depends_on:
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: "on-failure:5"
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  # ── DB 자동백업 (R11-01 웨이브 3 — SPRINT_R11_01.md §7.0 DB 자동백업 행) ──
  # postgres 이미지 재사용(추가 이미지 없음). scripts/db_backup.sh를 loop 모드로
  # 실행 — BACKUP_INTERVAL_SEC(기본 86400=일 1회)마다 pg_dump(custom format) 후
  # 최신 BACKUP_KEEP(기본 7)개만 남기고 회전. 산출물은 db_backups 볼륨(/backups).
  # 수동 1회는 호스트에서 scripts/db_backup.sh once, 복원은 scripts/db_restore.sh
  # (기본값 = 임시 DB 리허설 — 실DB를 덮는 경로 없음). 오프사이트 저장은 범위 밖(§7.0).
  db-backup:
    image: postgres:16-alpine
    restart: "on-failure:5"
    env_file: .env
    entrypoint: ["bash", "/usr/local/bin/db_backup.sh", "loop"]
    environment:
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SEC: ${BACKUP_INTERVAL_SEC:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - db_backups:/backups
      - ./scripts/db_backup.sh:/usr/local/bin/db_backup.sh:ro
    depends_on:
      postgres:
        condition: service_started

  redis:
    # 7.2 고정 — 7.4부터 라이선스가 RSALv2/SSPL(OSI 미승인)로 바뀌었다. 대회 규정이
    # "GPL 계열은 활용 범위 제약 가능"이라 경고했는데 SSPL은 그보다 강하다.
    # 7.2는 BSD-3이고 우리는 브로커·캐시로만 쓰므로 기능 손실이 없다.
    # 근거: docs/team/HACKATHON_RULES.md §4-C
    image: redis:7.2-alpine
    restart: "on-failure:5"
    env_file: .env
    # ── 설정 파일 기동 (CO-P-11 / CO-Q-8) ─────────────────────────────────────
    # 종전에는 인자 없이 `redis-server`가 떠서 **영속성도 메모리 상한도 기본값**
    # 이었다(2026-08-09 라이브 실측: appendonly no · maxmemory 0). Redis에 세션이
    # 사는 구조라 그건 "유실 = 전 게스트 영구 로그아웃"을 그대로 안고 가는 것이다.
    # 정책 판단과 근거는 infra/redis.conf 안에 적혀 있다(여기서 반복하지 않는다).
    # dev·prod 공통으로 같은 설정을 쓴다 — 내구성 동작이 환경마다 다르면
    # dev에서 재현되지 않는 유실이 prod에서만 난다.
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redisdata:/data
      - ./infra/redis.conf:/usr/local/etc/redis/redis.conf:ro

volumes:
  pgdata:
  redisdata:
  db_backups:
