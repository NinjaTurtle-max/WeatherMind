# =============================================================================
# WeatherMind Redis 설정 — 인증 SPOF 방어 (CO-P-11 / CO-Q-8)
#
# 적용: docker-compose.yml의 redis 서비스가 이 파일을 /usr/local/etc/redis/redis.conf
#       로 마운트하고 `redis-server <경로>`로 기동한다. dev·prod 공통이다
#       (오버레이가 command를 덮지 않는다 — 재현성을 위해 한쪽만 다르게 두지 않는다).
#
# ⚠️ **compose config -q는 이 파일을 검증하지 않는다.** 문법을 고치면 redis가
#    기동에 실패하는데 파스 게이트는 초록이다. 수정 시 실기동으로 확인할 것:
#      docker run --rm -v "$PWD/infra/redis.conf:/etc/redis.conf:ro" \
#        redis:7.2-alpine redis-server /etc/redis.conf
#
# **왜 이 파일이 필요한가** (2026-08-09 라이브 실측: appendonly no · maxmemory 0 ·
# maxmemory-policy noeviction — 즉 방어가 0이었다):
#   Redis에 **세션이 산다**. refresh token이 `session:{user_id}`로 7일 TTL 저장되고
#   (`backend/app/routers/auth.py` `_store_session`), 인증 의존성이 매 요청 그 키의
#   존재를 확인한다(`core/dependencies.py`). 이 키가 사라지면 **전 유저 로그아웃**이고,
#   게스트에게 로그아웃은 계정 복구 수단이 없으므로 **진도 영구 소실**이다(CO-P-4).
#   같은 인스턴스가 celery 브로커이기도 하다 — 큐는 TTL 없는 리스트라 유실 = 작업 증발.
# =============================================================================

# ── 네트워크 ─────────────────────────────────────────────────────────────────
# bind를 지정하지 않아 전 인터페이스에서 듣는다. compose 파일 어디에도 redis의
# `ports:` 매핑이 없어 **컨테이너 네트워크 밖으로 노출되지 않는다** — 호스트에
# 열려 있지 않으므로 protected-mode를 끄는 것이 안전하다.
# ⚠️ redis에 `ports:`를 추가한다면 이 줄을 먼저 되돌리고 requirepass를 검토할 것.
protected-mode no

# ── 영속성 ①: RDB 스냅샷 ─────────────────────────────────────────────────────
# 설정 파일을 주면 컴파일 기본값 대신 여기 적힌 값이 쓰이므로, 종전 동작
# (기본 save 포인트)을 **명시적으로** 유지한다. 빼면 스냅샷이 통째로 꺼진다.
dir /data
save 3600 1
save 300 100
save 60 10000

# ── 영속성 ②: AOF ────────────────────────────────────────────────────────────
# ⚠️ **기존 볼륨에 이 파일을 처음 적용할 때 1회 마이그레이션이 필요하다.**
# 2026-08-09 redis:7.2.15로 실측한 결과: RDB만 있던 데이터 디렉토리에 대고
# `appendonly yes`로 재기동하면 Redis가 **빈 AOF를 새로 만들고 기존 dump.rdb를
# 무시한다**(로그: "Creating AOF base file ... on server start", 저장해 둔 키 GET =
# nil). 즉 **그 볼륨의 세션이 전부 날아간다**. 신규 볼륨에는 해당 없다.
# 안전한 절차(같은 조건에서 키 생존 확인함) — 기동 중에 라이브로 켠 뒤 재기동한다:
#   docker compose exec redis redis-cli CONFIG SET appendonly yes
#   docker compose up -d --force-recreate redis
# 라이브 전환은 현재 메모리 내용으로 AOF base를 써서 데이터를 보존한다.
# RDB만으로는 최대 1시간(save 3600 1) 분량이 날아간다 — 그 1시간에 가입한 게스트는
# 재기동 즉시 진도를 잃는다. AOF는 초 단위로 좁힌다.
# everysec = 성능·내구성 절충(기본값). always는 매 쓰기 fsync라 세션 저장이
# 디스크 지연에 묶이고, no는 OS에 맡겨 사실상 방어가 없다.
appendonly yes
appendfsync everysec
# 재작성 중에도 쓰기를 fsync한다 — 지연은 늘지만 재작성 창(가장 취약한 구간)에
# 유실이 생기지 않는다. 우리 쓰기량(세션·캐시)에서 이 비용은 무시할 수준이다.
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ── 메모리 상한과 축출 정책 ───────────────────────────────────────────────────
# maxmemory는 컨테이너 mem_limit(prod 192m)보다 **낮아야** 의미가 있다. 그래야
# Redis가 자기 한도에서 먼저 반응하고, 커널 OOM killer가 프로세스를 죽이는
# (= AOF에 안 내려간 쓰기까지 함께 잃는) 순서로 가지 않는다. 128mb는 192m의 2/3로,
# 나머지 64m를 AOF 버퍼·재작성 fork의 copy-on-write·redis 자체 오버헤드에 남긴다.
# 실측 사용량은 20MB(2026-08-06)라 128mb 도달은 정상 운영이 아니라 폭주다.
maxmemory 128mb

# **정책 선택이 이 파일의 핵심 판단이다.** 세션·celery 브로커·기상 캐시가
# **전부 같은 DB 0**을 쓴다(`REDIS_URL=redis://redis:6379/0` — backend·celery 공통).
#   · allkeys-lru  → 세션과 브로커 큐가 캐시에 밀려 축출된다. 로그아웃 + 작업 증발.
#   · volatile-*   → **세션을 지키지 못한다.** `session:*`는 TTL 7일짜리라
#                    volatile 집합에 들어가고, 기상 캐시와 같은 후보로 취급된다.
#   · DB 분리      → 해결이 아니다. `maxmemory-policy`는 **인스턴스 단위**라
#                    DB 번호를 갈라도 정책을 섞을 수 없다. 캐시를 정말 분리하려면
#                    **별도 Redis 인스턴스**가 필요하고, 그건 이번 범위 밖이다.
#   · noeviction   → 상한에 닿으면 쓰기가 **에러로 실패**한다. 기존 세션과 큐는
#                    그대로 살아 있고, 실패가 로그에 남아 조용히 사라지지 않는다.
# 소리 없이 세션·작업을 잃는 것보다 시끄럽게 쓰기를 거절하는 편이 낫다는 판단이다.
maxmemory-policy noeviction
